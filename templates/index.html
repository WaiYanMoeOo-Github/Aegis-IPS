<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis-AI IPS Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #e0e0e0; }
        .card { background-color: #1e1e1e; border: 1px solid #333; }
        .table-dark { --bs-table-bg: #1e1e1e; }
        .reason-cell { max-width: 340px; font-size: 0.9rem; color: #bdbdbd; }
    </style>
</head>
<body>
    <div class="container mt-5 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-danger mb-0">Aegis-AI: Intrusion Prevention System</h2>
            <span class="badge bg-success fs-6">System Active (Live)</span>
        </div>

        <!-- Stats Cards -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card shadow-sm border-secondary">
                    <div class="card-body">
                        <h6 class="text-secondary text-uppercase mb-1">Total Monitored IPs</h6>
                        <h3 class="mb-0 text-light fw-bold" id="statTotal">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm border-danger">
                    <div class="card-body">
                        <h6 class="text-danger text-uppercase mb-1">Active Blocked Threats</h6>
                        <h3 class="mb-0 text-danger fw-bold" id="statBlocked">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm border-success">
                    <div class="card-body">
                        <h6 class="text-success text-uppercase mb-1">Allowed / Unblocked</h6>
                        <h3 class="mb-0 text-success fw-bold" id="statAllowed">0</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- Live Logs Table -->
        <div class="card shadow-lg">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-dark table-hover mb-0">
                        <thead class="table-active">
                            <tr>
                                <th class="ps-4">Time</th>
                                <th>Source IP</th>
                                <th>Protocol &amp; Flags</th>
                                <th>Detection (AI)</th>
                                <th>AI Reasoning</th>
                                <th>Status</th>
                                <th class="text-center pe-4">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="logTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text ?? '';
            return div.innerHTML;
        }

        function renderProtocolAndFlags(protocol, tcpFlags) {
            const proto = (protocol || 'UNKNOWN').toUpperCase();
            let protoBadge = `<span class="badge bg-secondary">${escapeHtml(proto)}</span>`;

            if (proto === 'TCP') {
                protoBadge = `<span class="badge bg-primary">TCP</span>`;
            } else if (proto === 'UDP') {
                protoBadge = `<span class="badge bg-info text-dark">UDP</span>`;
            } else if (proto === 'ICMP') {
                protoBadge = `<span class="badge bg-warning text-dark">ICMP</span>`;
            }

            if (proto === 'TCP' && tcpFlags && tcpFlags !== '-') {
                const scanFlags = new Set(['SYN', 'NULL', 'FIN-PSH-URG', 'FIN', 'RST']);
                const flagBadges = tcpFlags.split(',').map(rawFlag => {
                    const flag = rawFlag.trim();
                    const safeFlag = escapeHtml(flag);
                    if (scanFlags.has(flag)) {
                        return `<span class="badge bg-danger bg-opacity-25 text-danger border border-danger font-monospace ms-1">${safeFlag}</span>`;
                    }
                    return `<span class="badge bg-dark border border-secondary text-light font-monospace ms-1">${safeFlag}</span>`;
                }).join('');
                return `${protoBadge}${flagBadges}`;
            }

            return protoBadge;
        }

        async function fetchLogs() {
            const response = await fetch('/api/logs');
            const data = await response.json();
            const logs = data.logs || [];

            // Update Stats Cards
            const totalCount = logs.length;
            const blockedCount = logs.filter(l => l.status === 'Blocked').length;
            const allowedCount = totalCount - blockedCount;

            document.getElementById('statTotal').textContent = totalCount;
            document.getElementById('statBlocked').textContent = blockedCount;
            document.getElementById('statAllowed').textContent = allowedCount;

            // Update Table Rows
            const tbody = document.getElementById('logTableBody');
            tbody.innerHTML = '';

            logs.forEach(log => {
                const statusBadge = log.status === 'Blocked' 
                    ? '<span class="badge bg-danger">Blocked</span>' 
                    : '<span class="badge bg-warning text-dark">Unblocked</span>';
                
                const actionBtn = log.status === 'Blocked'
                    ? `<button class="btn btn-sm btn-outline-success w-100 fw-bold" onclick="performAction('${escapeHtml(log.ip)}', 'unblock')">Unblock</button>`
                    : `<button class="btn btn-sm btn-outline-danger w-100 fw-bold" onclick="performAction('${escapeHtml(log.ip)}', 'block')">Block</button>`;

                tbody.innerHTML += `
                    <tr>
                        <td class="ps-4 align-middle text-nowrap">${escapeHtml(log.time)}</td>
                        <td class="font-monospace text-info align-middle text-nowrap">${escapeHtml(log.ip)}</td>
                        <td class="align-middle text-nowrap">${renderProtocolAndFlags(log.protocol, log.tcp_flags)}</td>
                        <td class="align-middle fw-semibold">${escapeHtml(log.attack)}</td>
                        <td class="align-middle reason-cell">${escapeHtml(log.reason || '-')}</td>
                        <td class="align-middle">${statusBadge}</td>
                        <td class="pe-4 align-middle" style="width: 130px;">${actionBtn}</td>
                    </tr>
                `;
            });
        }

        async function performAction(ip, action) {
            await fetch('/api/action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ip: ip, action: action })
            });
            fetchLogs();
        }

        fetchLogs();
        setInterval(fetchLogs, 3000);
    </script>
</body>
</html>
